name: Temporary PR 5 DLL synchronization

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/project-thread-8c4csj' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - name: Select deterministic SDK
        run: dotnet new globaljson --sdk-version 10.0.100 --roll-forward disable
      - name: Build DLL
        run: dotnet build Source/Game/MoreUseResources.csproj -c Release
      - name: Synchronize committed assembly
        shell: bash
        run: |
          cp Source/Game/bin/Release/net10.0/MoreUseResources.dll Assemblies/MoreUseResources.dll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assemblies/MoreUseResources.dll
          if git diff --cached --quiet; then
            echo "DLL already synchronized"
            exit 0
          fi
          git commit -m "Sync built DLL for PR #5"
          git push origin HEAD:refs/heads/claude/project-thread-8c4csj
